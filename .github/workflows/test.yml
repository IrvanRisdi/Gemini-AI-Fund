name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Supported Workspaces
        run: npm run build

      - name: Run Governed Checks
        run: npm run check

      - name: Typecheck Web Dashboard
        run: npm run typecheck --workspace=dashboard

      - name: Run Crypto Strategy & Dashboard Unit Tests
        run: npx tsx --test scripts/*.test.ts dashboard/lib/*.test.ts

      - name: Run IDX Stock Engine (NusaQuant) Unit Tests
        working-directory: stocks-engine
        run: python3 -m unittest discover -s tests -p "test_*.py"
