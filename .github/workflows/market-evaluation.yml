name: Gemini Daily Intelligence & Telegram Delivery

on:
  schedule:
    # 1x sehari: 00:00 UTC = 07:00 WIB (Laporan Harian Pagi Terpadu - Kripto & Saham BEI)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading-state-writers
  cancel-in-progress: false

jobs:
  evaluate-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ambil riwayat lengkap agar rebase berjalan lancar

      - name: Restore Latest Paper State
        run: |
          git fetch origin paper-data || true
          if git rev-parse --verify origin/paper-data >/dev/null 2>&1; then
            git checkout origin/paper-data -- .desk stocks-engine/.stock-desk
            git reset
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Gemini Strategy Evaluation & Telegram Delivery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-argon
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/daily-evaluation.ts

      - name: Commit Updated Briefings
        run: |
          git config --global user.name "Gemini Evaluator"
          git config --global user.email "evaluator@gemini-ai-fund.local"
          git add .desk/ stocks-engine/.stock-desk/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gemini): update session review [skip ci]"
            git push --force-with-lease origin HEAD:paper-data
          fi

