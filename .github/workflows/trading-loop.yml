name: 24/7 Trading Loop Engine

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-trading-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Deterministic Scan & Paper Trade
        run: npx tsx scripts/scan-signals.ts

      - name: Commit and Push Updated Desk State
        run: |
          git config --global user.name "Gemini AI-Fund Bot"
          git config --global user.email "bot@gemini-ai-fund.local"
          git add .desk/
          git diff-index --quiet HEAD || (git commit -m "chore(bot): update paper trading ledger [skip ci]" && git push)
