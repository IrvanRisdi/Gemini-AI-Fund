name: 24/7 Trading Loop Engine

on:
  schedule:
    # Berjalan setiap 15 menit
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading-state-writers
  cancel-in-progress: false

jobs:
  run-trading-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Latest Paper State
        run: |
          git fetch origin paper-data || true
          if git rev-parse --verify origin/paper-data >/dev/null 2>&1; then
            git checkout origin/paper-data -- .desk stocks-engine/.stock-desk
            git reset
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Scan Market Signals
        run: npx tsx scripts/scan-signals.ts

      - name: 2. Execute Paper Orders & Update Ledger
        run: npx tsx scripts/execute-paper-trades.ts

      - name: 3. Commit and Push Updated Ledger State
        run: |
          git config user.name "Gemini AI-Fund Bot"
          git config user.email "bot@gemini-ai-fund.local"
          git add .desk/ stocks-engine/.stock-desk/
          if git diff --cached --quiet; then
            echo "No coin state change"
            exit 0
          fi
          git commit -m "chore(bot): update paper trading ledger [skip ci]"
          git push --force-with-lease origin HEAD:paper-data

