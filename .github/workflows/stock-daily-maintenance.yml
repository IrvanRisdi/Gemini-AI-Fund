name: IDX Daily Breadth and Arjum Maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading-state-writers
  cancel-in-progress: false

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Jakarta
      NQ_ENV: production
      NQ_DATA_DIR: ${{ github.workspace }}/.runtime/stocks
      NQ_DEMO_MODE: 'false'
      NQ_PAPER_ONLY: 'true'
      NQ_YAHOO_ENABLED: 'true'
      NQ_ALLOW_DELAYED_PAPER: 'true'
      NQ_ARJUM_ENABLED: 'true'
      ARJUM_DAILY_LIMIT: '21000'
      NQ_ARJUM_CANDIDATE_LIMIT: '20'
      ARJUM_API_KEY: ${{ secrets.ARJUM_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore latest paper state
        run: |
          git fetch origin paper-data || true
          if git rev-parse --verify origin/paper-data >/dev/null 2>&1; then
            git checkout origin/paper-data -- .desk stocks-engine/.stock-desk
            git reset
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run daily breadth and enrichment
        run: python stocks-engine/scripts/run_github_maintenance.py

      - name: Commit compact daily state
        run: |
          git config user.name "NusaQuant Daily Bot"
          git config user.email "nusaquant-daily@users.noreply.github.com"
          git add .desk/ stocks-engine/.stock-desk/
          if git diff --cached --quiet; then
            echo "No daily stock state change"
            exit 0
          fi
          git commit -m "chore(stock-bot): publish IDX daily report [skip ci]"
          git push --force-with-lease origin HEAD:paper-data

      - name: Upload daily diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: idx-daily-${{ github.run_id }}
          path: stocks-engine/.stock-desk/dashboard.json
          if-no-files-found: warn
          retention-days: 14

